name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android
          rm -rf android/app/src/main/assets/public/assets/aistudio

      - name: Auto-increment Android versionCode for smooth in-place updates
        run: |
          NEW_CODE=$((110 + GITHUB_RUN_NUMBER))
          NEW_VER="1.3.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${NEW_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${NEW_VER}\"/" android/app/build.gradle
          echo "VERSION_CODE=${NEW_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${NEW_VER}" >> "$GITHUB_ENV"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 36 & Build-Tools
        run: |
          SDK_MANAGER=$(command -v sdkmanager || ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses || true
          yes | "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug & Release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Sign Release APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/police-out-debug.apk

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="out/app-release-aligned.apk"
          FINAL_APK="out/police-out-release.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > out/release.jks
            "$BUILD_TOOLS/apksigner" sign \
              --ks out/release.jks \
              --ks-pass "pass:${KEYSTORE_PASS}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "$FINAL_APK" \
              "$ALIGNED"
            rm -f out/release.jks "$ALIGNED"
          else
            # Fallback auto-generated keystore if secret is unset
            keytool -genkeypair -v \
              -keystore out/police-out-keystore.jks \
              -storepass "PoliceOut2026!" \
              -keypass "PoliceOut2026!" \
              -alias police_out \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Police Out, O=Police Out, C=EG"
            "$BUILD_TOOLS/apksigner" sign \
              --ks out/police-out-keystore.jks \
              --ks-pass "pass:PoliceOut2026!" \
              --ks-key-alias police_out \
              --key-pass "pass:PoliceOut2026!" \
              --out "$FINAL_APK" \
              "$ALIGNED"
            rm -f "$ALIGNED"
          fi

          echo "=== Release APK Certificate Fingerprints ==="
          keytool -printcert -jarfile "$FINAL_APK" | tee out/apk-fingerprint.txt
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Police Out v${VERSION_NAME} (versionCode ${VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat out/apk-fingerprint.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: police-out-android-apk
          path: out/*

      - name: Publish Direct APK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release create "$TAG" out/police-out-release.apk \
            --title "Police Out ${TAG}" \
            --notes "Direct Release APK (signed with persistent keystore for in-place updates without uninstalling). Version Code: ${VERSION_CODE}" \
            || gh release upload "$TAG" out/police-out-release.apk --clobber

      - name: Auto-push APK to itch.io (when BUTLER_API_KEY & ITCH_TARGET are set)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          if [ -n "$BUTLER_API_KEY" ] && [ -n "$ITCH_TARGET" ]; then
            curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -q butler.zip -d butler_bin
            chmod +x butler_bin/butler
            ./butler_bin/butler push out/police-out-release.apk "$ITCH_TARGET" --userversion "${VERSION_NAME}"
          else
            echo "Skipping itch.io butler push (BUTLER_API_KEY or ITCH_TARGET secret not configured)."
          fi
